name: 'Setup the self-hosted environment'
description: 'Setup the self-hosted environment'
inputs:
  GITHUB_PAT:
    description: 'GitHub PAT to clone private repositories'
    required: true
    default: ''
  GITE_PAT:
    description: "LIRMM's GitLab PAT to clone private repositories"
    required: true
    default: ''
runs:
  using: "composite"
  steps:
    - run: |
        set -e
        sudo sed -i -e 's/http:\/\/archive\.ubuntu\.com\/ubuntu\//http:\/\/jp.archive\.ubuntu\.com\/ubuntu\//' /etc/apt/sources.list
        echo 'Acquire::Retries "10";' | sudo tee /etc/apt/apt.conf.d/80-retries

        rm -f ~/.gitconfig ~/.config/git/config ~/.git-credentials

        git config --global credential.helper store

        if [[ -n "${{ inputs.GITHUB_PAT }}" ]]; then
          git config --global url."https://github.com/".insteadOf git@github.com:
          printf "https://x-access-token:%s@github.com\n" "${{ inputs.GITHUB_PAT }}" >> ~/.git-credentials
        fi

        if [[ -n "${{ inputs.GITE_PAT }}" ]]; then
          git config --global url."https://gite.lirmm.fr/".insteadOf git@gite.lirmm.fr:
          printf "https://oauth2:%s@gite.lirmm.fr\n" "${{ inputs.GITE_PAT }}" >> ~/.git-credentials
        fi

        chmod 600 ~/.git-credentials || true
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@example.com"
      shell: bash
