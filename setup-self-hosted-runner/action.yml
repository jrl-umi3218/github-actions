name: 'Setup the self-hosted environment'
description: 'Setup the self-hosted environment'
inputs:
  GITHUB_PAT:
    description: 'GitHub PAT to clone private repositories'
    required: true
    default: ''
  GITE_PAT:
    description: "LIRMM's GitLab PAT to clone private repositories"
    required: true
    default: ''
runs:
  using: "composite"
  steps:
    - run: |
        set -x
        set -e
        sudo sed -i -e 's/http:\/\/archive\.ubuntu\.com\/ubuntu\//http:\/\/jp.archive\.ubuntu\.com\/ubuntu\//' /etc/apt/sources.list
        echo 'Acquire::Retries "10";' | sudo tee /etc/apt/apt.conf.d/80-retries
        rm -f ~/.gitconfig ~/.config/git/config
        if [[ -n "${{ inputs.GITHUB_PAT }}" ]]
        then
          AUTH_GH=$(printf "x-access-token:%s" "${{ inputs.GITHUB_PAT }}" | base64 -w0)
          git config --global --unset-all http.https://github.com/.extraHeader || true
          git config --global http.https://github.com/.extraHeader "AUTHORIZATION: basic ${AUTH_GH}"
        fi
        if [[ -n "${{ inputs.GITE_PAT }}" ]]
        then
          AUTH_GITE=$(printf "oauth2:%s" "${{ inputs.GITE_PAT }}" | base64 -w0)
          git config --global --unset-all http.https://gite.lirmm.fr/.extraHeader || true
          git config --global http.https://gite.lirmm.fr/.extraHeader "AUTHORIZATION: basic ${AUTH_GITE}"
        fi
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@example.com"
      shell: bash
